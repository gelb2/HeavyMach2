<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#101b20">
  <title>HeavyMach 2</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="HeavyMach 2">
  <meta property="og:description" content="헤비멕2를 브라우저에서 플레이하거나 홈 화면에 설치하세요.">
  <meta property="og:url" content="https://gelb2.github.io/HeavyMach2/">
  <meta property="og:image" content="https://gelb2.github.io/HeavyMach2/social-preview.jpg">
  <meta property="og:image:width" content="889">
  <meta property="og:image:height" content="1280">
  <meta property="og:image:alt" content="헤비멕2 iPad 탭 투 플레이 화면">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" id="install-manifest">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-validation="false">
  <main>
    <canvas id="game" aria-label="HeavyMach 2 게임 화면" tabindex="0" hidden></canvas>
    <section id="launcher" aria-labelledby="title">
      <h1 id="title">HeavyMach 2</h1>
      <p id="status" role="status">게임을 준비하는 중…</p>
      <progress id="download-progress" aria-label="게임 파일 다운로드 및 검증" hidden></progress>
      <div class="actions">
        <button id="install" type="button" aria-controls="install-help">설치 방법</button>
        <button id="play" type="button" disabled>브라우저에서 플레이</button>
      </div>
      <p id="install-help" tabindex="-1" role="status">앱으로 설치해 플레이하는 것을 권장합니다.</p>
    </section>
    <output id="warning" role="status" hidden></output>
    <p id="rotate" role="status" hidden>휴대폰을 가로로 돌려 주세요.</p>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="dialog-form">
      <h2 id="dialog-title"></h2>
      <p id="dialog-body"></p>
      <label id="entry-label" hidden>프로필 이름<input id="entry" autocomplete="off" maxlength="10"></label>
      <label id="transfer-label" hidden>복구코드<textarea id="code" rows="5" spellcheck="false" autocomplete="off"></textarea></label>
      <output id="dialog-status" role="status"></output>
      <div class="actions">
        <button id="generate" type="button" hidden>코드 만들기</button>
        <button id="copy" type="button" hidden>복사</button>
        <button id="cancel" type="button">닫기</button>
        <button id="confirm" type="submit">확인</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
