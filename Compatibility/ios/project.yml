name: HeavyMach2Reference
options:
  deploymentTarget:
    iOS: "15.0"
targets:
  HM2ReferencePhone:
    type: application
    platform: iOS
    sources: [Stub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach2.reference.phone
        PRODUCT_NAME: HM2ReferencePhone
        HM2_DISPLAY_NAME: "HM2 Reference Phone"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CONFIGURATION_BUILD_DIR: "$(HOME)/Documents/Codex/HeavyMach2/ReferenceBuilds/DerivedData/Build/Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Package local HM2 original
        script: |
          set -eu
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=aarch64-apple-ios-sim; else TARGET=aarch64-apple-ios; fi
          "$SRCROOT/../build-runtime.sh" "$TARGET"
          python3 "$SRCROOT/../package_reference.py" phone --target "$TARGET" --xcode
        basedOnDependencyAnalysis: false
  HM2ReferenceHD:
    type: application
    platform: iOS
    sources: [Stub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach2.reference.hd
        PRODUCT_NAME: HM2ReferenceHD
        HM2_DISPLAY_NAME: "HM2 Reference HD"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CONFIGURATION_BUILD_DIR: "$(HOME)/Documents/Codex/HeavyMach2/ReferenceBuilds/DerivedData/Build/Products/$(CONFIGURATION)$(EFFECTIVE_PLATFORM_NAME)"
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Package local HM2 original
        script: |
          set -eu
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then TARGET=aarch64-apple-ios-sim; else TARGET=aarch64-apple-ios; fi
          "$SRCROOT/../build-runtime.sh" "$TARGET"
          python3 "$SRCROOT/../package_reference.py" hd --target "$TARGET" --xcode
        basedOnDependencyAnalysis: false
